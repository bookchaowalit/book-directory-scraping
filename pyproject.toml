[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-directory-scraping"
version = "0.2.0"
description = "Local business directory collection and bounded location opportunity analysis."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["location_intelligence*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
